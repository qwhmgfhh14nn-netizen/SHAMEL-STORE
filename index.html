<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b46"><title>SHAMEL | شامل</title>
<style>
*{box-sizing:border-box}body{margin:0;padding-bottom:80px;background:#f5f7fa;color:#172b40;font-family:Arial}
header,footer{background:#102b46;color:white;padding:18px}header p{margin-bottom:0}
.logo{font-size:25px;font-weight:bold}.logo span{color:#e9b94e}
button{border:0;border-radius:9px;padding:11px;cursor:pointer}.gold{background:#e9b94e;color:#102b46;font-weight:bold}.light{background:white;color:#102b46;border:1px solid #ddd}
main{padding:14px}.page{display:none}.page.active{display:block}.hero,.panel,.empty{background:white;border-radius:14px;padding:18px;margin:12px 0}.hero{background:#102b46;color:white}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{background:white;border:1px solid #eee;border-radius:12px;overflow:hidden}.product img{width:100%;height:140px;object-fit:cover}.product-info{padding:10px}.price{color:#08734e;font-weight:bold}
.muted{color:#687789;font-size:13px}.status{background:#eef5f9;padding:10px;border-radius:9px;margin:10px 0}
nav{display:flex;gap:7px;overflow:auto;padding:12px}nav button{white-space:nowrap;background:white}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.bottom-nav button{background:white;font-size:12px}.bottom-nav .active{background:#fff4d6}
.actions{display:flex;gap:8px}.actions button{flex:1}.hidden{display:none!important}
@media(min-width:700px){main{max-width:1000px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="logo">SHAMEL <span>شامل</span></div><p>كل احتياجاتك في مكان واحد</p><button class="gold" onclick="showPage('account')">حسابي</button></header>
<input id="search" placeholder="ابحث عن المنتجات..." style="width:calc(100% - 28px);margin:14px">
<nav><button onclick="showPage('home')">الرئيسية</button><button onclick="showPage('categories')">الأقسام</button></nav>
<section id="home" class="page active"><main><div class="hero"><h2>أهلاً بك في SHAMEL</h2><p>اكتشف المنتجات وتسوق بسهولة.</p></div><div id="connection-status" class="status">جارٍ الاتصال...</div><div id="products-grid" class="grid"></div><div id="products-empty" class="empty hidden">لا توجد منتجات منشورة حاليًا.</div></main></section>
<section id="categories" class="page"><main><h2>الأقسام</h2><div id="categories-list" class="grid"></div><div id="categories-empty" class="empty hidden">لا توجد أقسام.</div></main></section>
<section id="cart" class="page"><main><h2>سلة التسوق</h2><div id="cart-content"></div></main></section>
<section id="favorites" class="page"><main><h2>المفضلة</h2><div id="favorites-grid" class="grid"></div><div id="favorites-empty" class="empty">لا توجد مفضلة.</div></main></section>
<section id="orders" class="page"><main><h2>طلباتي</h2><div id="orders-content"></div></main></section>
<section id="account" class="page"><main><h2>حسابي</h2><div id="auth-status" class="status">زائر</div>
<div id="auth-form" class="panel"><button id="google-btn" class="light">Google</button><h3>رقم الهاتف</h3><input id="auth-phone" placeholder="+201xxxxxxxxx"><button id="phone-send-btn" class="gold">إرسال الرمز</button><div id="phone-verify-box" class="hidden"><input id="phone-otp" placeholder="رمز التحقق"><button id="phone-verify-btn">تأكيد</button></div>
<h3>البريد الإلكتروني</h3><input id="auth-email" type="email" placeholder="البريد الإلكتروني"><input id="auth-password" type="password" placeholder="كلمة المرور">
<div class="actions"><button id="login-btn" class="gold">دخول</button><button id="signup-btn" class="light">إنشاء حساب</button></div><button id="reset-btn" class="light">نسيت كلمة المرور؟</button>
<div id="new-password-box" class="hidden"><input id="new-password" type="password" placeholder="كلمة المرور الجديدة"><button id="save-new-password-btn">حفظ</button></div></div>
<div id="signed-in-panel" class="panel hidden"><button onclick="showPage('orders')">طلباتي</button><button id="logout-btn">تسجيل الخروج</button></div>
<p><a href="https://wa.me/201206449934">تواصل عبر واتساب</a></p></main></section>
<footer><div class="logo">SHAMEL <span>شامل</span></div><p>SHAMEL © 2026</p></footer>
<div class="bottom-nav"><button data-page="home" class="active" onclick="showPage('home')">🏠 الرئيسية</button><button data-page="categories" onclick="showPage('categories')">الأقسام</button><button data-page="cart" onclick="showPage('cart')">🛒 السلة</button><button data-page="favorites" onclick="showPage('favorites')">♡ المفضلة</button><button data-page="account" onclick="showPage('account')">حسابي</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
